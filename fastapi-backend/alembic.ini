# ------------------------------------------------------------------------------
# Alembic Configuration
# Team Productivity Platform - FastAPI Backend
# ------------------------------------------------------------------------------

[alembic]

script_location = %(here)s/alembic

prepend_sys_path = .

path_separator = os

timezone = UTC

output_encoding = utf-8

# --------------------------------------------------------------------------
# IMPORTANT
#
# This value is intentionally unused.
#
# The real DATABASE_URL is loaded dynamically from:
#
# app.core.config.Settings
#
# inside alembic/env.py
# --------------------------------------------------------------------------

sqlalchemy.url =

# ------------------------------------------------------------------------------
# Automatically format newly generated migration files
# ------------------------------------------------------------------------------

[post_write_hooks]

hooks = black,ruff

black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME

ruff.type = module
ruff.module = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = standard

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = standard

[formatter_standard]
format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
datefmt = %Y-%m-%d %H:%M:%S