# ==============================================================================
# Team Productivity Platform
# FastAPI + PostgreSQL Docker Compose
# ==============================================================================


services:


  # ============================================================================
  # FastAPI Backend
  # ============================================================================

  fastapi-backend:


    container_name: team_productivity_backend_app


    build:

      context: .

      dockerfile: Dockerfile



    restart: unless-stopped



    ports:

      - "8000:8000"



    env_file:

      - .env



    depends_on:


      team_productivity_db:

        condition: service_healthy



    volumes:


      - .:/app


      - fastapi_logs:/app/logs


      - fastapi_uploads:/app/uploads



    networks:

      - team-productivity-network



    healthcheck:


      test:

        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]


      interval: 30s

      timeout: 10s

      retries: 5

      start_period: 20s





  # ============================================================================
  # PostgreSQL Database
  # ============================================================================

  team_productivity_db:


    container_name: team_productivity_db


    image: postgres:15


    restart: unless-stopped



    environment:


      POSTGRES_USER:

        postgres


      POSTGRES_PASSWORD:

        postgres


      POSTGRES_DB:

        team_productivity



    ports:


      - "5435:5432"



    volumes:


      - team_productivity_postgres_data:/var/lib/postgresql/data



    healthcheck:


      test:

        [
          "CMD-SHELL",
          "pg_isready -U postgres -d team_productivity"
        ]


      interval:

        10s


      timeout:

        5s


      retries:

        5


      start_period:

        10s



    networks:


      - team-productivity-network





# ==============================================================================
# Volumes
# ==============================================================================

volumes:


  team_productivity_postgres_data:


  fastapi_logs:


  fastapi_uploads:




# ==============================================================================
# Network
# ==============================================================================

networks:


  team-productivity-network:


    driver:

      bridge