[build-system]
requires = [
    "setuptools>=77.0.3",
]
build-backend = "setuptools.build_meta"


# ==============================================================================
# Project Metadata
# ==============================================================================

[project]
name = "team-productivity-platform-fastapi"
version = "1.0.0"
description = "Enterprise-grade FastAPI backend for the Team Productivity Platform."
readme = "README.md"
requires-python = ">=3.12,<3.14"

license = "MIT"

authors = [
    { name = "Ashish Sharma" },
]

keywords = [
    "fastapi",
    "microservices",
    "productivity",
    "team-management",
    "rest-api",
    "postgresql",
    "sqlalchemy",
    "jwt",
    "authentication",
    "notes",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development",
]


# ==============================================================================
# Runtime Dependencies
# ==============================================================================

dependencies = [

    # --------------------------------------------------------------------------
    # Web framework
    # --------------------------------------------------------------------------

    "fastapi>=0.139.2,<0.140.0",
    "uvicorn[standard]>=0.46.0,<0.47.0",

    # --------------------------------------------------------------------------
    # Validation & configuration
    # --------------------------------------------------------------------------

    "pydantic>=2.13.4,<2.14.0",
    "pydantic-settings>=2.14.2,<2.15.0",
    "email-validator>=2.3.0,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "python-multipart>=0.0.32,<1.0.0",

    # --------------------------------------------------------------------------
    # Database
    # --------------------------------------------------------------------------

    "sqlalchemy>=2.0.51,<2.1.0",
    "psycopg[binary]>=3.2.10,<4.0.0",
    "alembic>=1.18.4,<2.0.0",

    # --------------------------------------------------------------------------
    # Authentication & security
    # --------------------------------------------------------------------------

    "python-jose[cryptography]>=3.5.0,<4.0.0",
    "pwdlib[argon2]>=0.3.0,<1.0.0",
    "authlib>=1.7.0,<2.0.0",
    "pyotp>=2.10.0,<3.0.0",

    # --------------------------------------------------------------------------
    # HTTP / external services
    # --------------------------------------------------------------------------

    "httpx>=0.28.1,<1.0.0",
    "tenacity>=9.1.4,<10.0.0",

    # --------------------------------------------------------------------------
    # Serialization / performance
    # --------------------------------------------------------------------------

    "orjson>=3.11.9,<4.0.0",

    # --------------------------------------------------------------------------
    # Caching / rate limiting
    # --------------------------------------------------------------------------

    "redis>=8.0.1,<9.0.0",
    "slowapi>=0.1.10,<1.0.0",

    # --------------------------------------------------------------------------
    # Background jobs
    # --------------------------------------------------------------------------

    "celery>=5.6.3,<6.0.0",

    # --------------------------------------------------------------------------
    # File storage / uploads
    # --------------------------------------------------------------------------

    "aiofiles>=25.1.0,<26.0.0",
    "pillow>=12.3.0,<13.0.0",
    "python-magic>=0.4.27,<1.0.0",
    "boto3>=1.43.40,<2.0.0",
    "minio>=7.2.20,<8.0.0",

    # --------------------------------------------------------------------------
    # Email
    # --------------------------------------------------------------------------

    "aiosmtplib>=5.1.2,<6.0.0",

    # --------------------------------------------------------------------------
    # Utility / application features
    # --------------------------------------------------------------------------

    "python-slugify>=8.0.4,<9.0.0",
    "rapidfuzz>=3.14.5,<4.0.0",
    "user-agents>=2.2.0,<3.0.0",
    "qrcode[pil]>=8.2,<9.0.0",

    # --------------------------------------------------------------------------
    # API pagination
    # --------------------------------------------------------------------------

    "fastapi-pagination>=0.15.12,<1.0.0",

    # --------------------------------------------------------------------------
    # Structured logging
    # --------------------------------------------------------------------------

    "structlog>=26.1.0,<27.0.0",
]


# ==============================================================================
# Project URLs
# ==============================================================================

[project.urls]
Homepage = "https://github.com/Ashu11122000/Team-Productivity-Platform"
Repository = "https://github.com/Ashu11122000/Team-Productivity-Platform"
Issues = "https://github.com/Ashu11122000/Team-Productivity-Platform/issues"


# ==============================================================================
# Dependency Groups
# ==============================================================================

[dependency-groups]

# ------------------------------------------------------------------------------
# Development
# ------------------------------------------------------------------------------

dev = [
    "ipython>=9.5.0,<10.0.0",
    "pre-commit>=4.3.0,<5.0.0",
    "watchfiles>=1.1.0,<2.0.0",
]


# ------------------------------------------------------------------------------
# Linting
# ------------------------------------------------------------------------------

lint = [
    "ruff>=0.13.2,<0.14.0",
]


# ------------------------------------------------------------------------------
# Formatting
# ------------------------------------------------------------------------------

format = [
    "black>=25.9.0,<26.0.0",
    "isort>=6.0.1,<7.0.0",
]


# ------------------------------------------------------------------------------
# Type Checking
# ------------------------------------------------------------------------------

typecheck = [
    "mypy>=1.18.2,<2.0.0",
]


# ------------------------------------------------------------------------------
# Testing
# ------------------------------------------------------------------------------

test = [
    "factory-boy>=3.3.3,<4.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
]


# ------------------------------------------------------------------------------
# Documentation
# ------------------------------------------------------------------------------

docs = [
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-material>=9.6.20,<10.0.0",
]


# ------------------------------------------------------------------------------
# Complete Local Development Environment
# ------------------------------------------------------------------------------

all = [
    { include-group = "dev" },
    { include-group = "lint" },
    { include-group = "format" },
    { include-group = "typecheck" },
    { include-group = "test" },
    { include-group = "docs" },
]


# ==============================================================================
# Black
# ==============================================================================

[tool.black]
line-length = 88

target-version = [
    "py312",
    "py313",
]


# ==============================================================================
# isort
# ==============================================================================

[tool.isort]
profile = "black"
line_length = 88
combine_as_imports = true


# ==============================================================================
# Ruff
# ==============================================================================

[tool.ruff]
line-length = 88
target-version = "py312"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
]

ignore = [
    "B008",
]


# ==============================================================================
# Pytest
# ==============================================================================

[tool.pytest.ini_options]
pythonpath = [
    ".",
]

testpaths = [
    "app/tests",
]

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

asyncio_mode = "auto"

filterwarnings = [
    "error",
]


# ==============================================================================
# Mypy
# ==============================================================================

[tool.mypy]
python_version = "3.12"

warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

ignore_missing_imports = true


# ==============================================================================
# Coverage
# ==============================================================================

[tool.coverage.run]
branch = true

source = [
    "app",
]


[tool.coverage.report]
show_missing = true
skip_covered = false

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]