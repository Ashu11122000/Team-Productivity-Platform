[project]
name = "team-productivity-platform-fastapi"
version = "1.0.0"
description = "Enterprise-grade FastAPI backend for the Team Productivity Platform."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }

authors = [
    { name = "Ashish Sharma" }
]

keywords = [
    "fastapi",
    "microservices",
    "productivity",
    "team-management",
    "rest-api",
    "postgresql",
    "sqlalchemy",
    "jwt",
    "authentication",
    "notes",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development",
]

dependencies = [
    "aiofiles>=25.1.0",
    "aiosmtplib>=5.1.2",
    "alembic>=1.18.4",
    "authlib>=1.7.0",
    "boto3>=1.43.40",
    "celery>=5.6.3",
    "email-validator>=2.3.0",
    "fastapi>=0.136.1",
    "fastapi-pagination>=0.15.12",
    "flower>=2.0.1",
    "httpx>=0.28.1",
    "httpx-cache>=0.13.0",
    "minio>=7.2.20",
    "orjson>=3.11.9",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2.10",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pyotp>=2.10.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.32",
    "python-slugify>=8.0.4",
    "qrcode[pil]>=8.2",
    "rapidfuzz>=3.14.5",
    "redis>=8.0.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.49",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "user-agents>=2.2.0",
    "uvicorn>=0.46.0",
]

[project.urls]
Homepage = "https://github.com/Ashu11122000/Team-Productivity-Platform"
Repository = "https://github.com/Ashu11122000/Team-Productivity-Platform"
Issues = "https://github.com/Ashu11122000/Team-Productivity-Platform/issues"

[dependency-groups]

dev = [
    "ipython>=9.5.0",
    "pre-commit>=4.3.0",
    "watchfiles>=1.1.0",
]

lint = [
    "ruff>=0.13.2",
]

format = [
    "black>=25.9.0",
    "isort>=6.0.1",
]

typecheck = [
    "mypy>=1.18.2",
]

test = [
    "factory-boy>=3.3.3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.20",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
combine_as_imports = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
]

ignore = [
    "B008",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "app/tests",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = [
    "app",
]

[tool.coverage.report]
show_missing = true
skip_covered = false