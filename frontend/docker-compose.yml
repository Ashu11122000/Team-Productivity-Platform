services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: team-productivity-frontend

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_FASTAPI_URL: http://localhost:8000
      NEXT_PUBLIC_NESTJS_URL: http://localhost:3001
      NEXT_PUBLIC_GA_ID: G-XXXXXXXXXX